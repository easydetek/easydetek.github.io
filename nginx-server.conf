# EasyDetek 文档站点 Nginx 反向代理配置（宿主机 Nginx）
#
# 部署位置：/etc/nginx/conf.d/docs.easydetek.com.conf
# （Ubuntu 若用 sites-available，需软链到 sites-enabled）
#
# ⚠️ 本文件是线上配置的基线，2026-11-16 证书过期事故后整理。改动前必读两条约束：
#
#   约束 1：80 端口的 `return 301` 必须写在 `location / { }` 内部，不能写成 server 级。
#           server 级 return 在 rewrite 阶段就短路，`location ^~ /.well-known/...`
#           永远不会命中，Let's Encrypt 的 http-01 校验会被 301 跳走 → 续签失败。
#
#   约束 2：/var/www/certbot 的 ACME location 块不可删除。
#           certbot 续签方式为 webroot（不是 standalone），靠它托管校验文件。
#           千万不要改回 `authenticator = standalone`：standalone 要独占 80 端口，
#           与宿主机 Nginx 冲突，会导致每次续签静默失败（本次证书过期的根因）。

# HTTP → HTTPS 跳转（同时承载 ACME 校验）
server {
    listen 80;
    server_name docs.easydetek.com;

    # --- ACME http-01 校验（certbot webroot 自动续签用，勿删） ---
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # ACME 校验必须先于跳转命中，因此 301 必须收在 location 内
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl;
    http2 on;
    server_name docs.easydetek.com;

    # --- SSL 证书（certbot 自动续签并 reload，机制见 DEPLOY.md） ---
    ssl_certificate     /etc/letsencrypt/live/docs.easydetek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.easydetek.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --- 站点主体 → Docker 容器 ---
    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- CMS OAuth 代理 → Docker 容器 ---
    location /auth {
        proxy_pass http://127.0.0.1:8093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /callback {
        proxy_pass http://127.0.0.1:8093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
