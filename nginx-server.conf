# EasyDetek 文档站点 Nginx 反向代理配置
# 部署位置：/etc/nginx/conf.d/docs.easydetek.com.conf
# 或：/etc/nginx/sites-available/docs.easydetek.com.conf（Ubuntu 需建软链接到 sites-enabled）

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name docs.easydetek.com;
    return 301 https://$host$request_uri;
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    server_name docs.easydetek.com;

    # --- SSL 证书 ---
    # 用 certbot 申请：sudo certbot --nginx -d docs.easydetek.com
    # 申请后 certbot 会自动填入下面的路径
    ssl_certificate     /etc/letsencrypt/live/docs.easydetek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.easydetek.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --- 站点主体 → Docker 容器 ---
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- CMS OAuth 代理 → Docker 容器 ---
    location /auth {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /callback {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
