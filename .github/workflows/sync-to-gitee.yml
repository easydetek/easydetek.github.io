# 将构建产物部署到 Gitee Pages（gh-pages 分支），并镜像源码到 Gitee main
# 认证方式：SSH 密钥（Gitee 最稳）
# 需要 GitHub Secrets: GITEE_SSH_KEY（私钥全文，含 BEGIN/END 行）
name: Sync to Gitee

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-sync:
    name: Build & Push to Gitee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website (中英文)
        run: npm run build

      # 配置 SSH：写入私钥并添加 Gitee 到已知主机
      - name: Setup SSH
        env:
          GITEE_SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${GITEE_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 gitee.com >> ~/.ssh/known_hosts 2>/dev/null

      # 1) 把构建产物推送到 Gitee 的 gh-pages 分支（供 Gitee Pages 托管）
      - name: Deploy build to Gitee Pages (gh-pages)
        run: |
          cd build
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b gh-pages
          git add -A
          git commit -q -m "deploy: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git remote add gitee "git@gitee.com:easydetek/easydetek.gitee.io.git"
          git push -f gitee gh-pages

      # 2) 镜像源码到 Gitee main 分支（方便国内团队查看/克隆源码）
      - name: Mirror source to Gitee main
        run: |
          git remote add gitee "git@gitee.com:easydetek/easydetek.gitee.io.git"
          git push -f gitee main
