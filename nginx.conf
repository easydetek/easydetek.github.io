# EasyDetek 站点 nginx 配置
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 站点根目录
    root /usr/share/nginx/html;
    index index.html;

    # ---------- gzip 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/x-font-ttf
        font/woff
        font/woff2
        image/svg+xml;

    # ---------- 默认字符集 ----------
    charset utf-8;

    # ---------- 静态资源长缓存（带 hash 的文件可永久缓存） ----------
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---------- HTML 不缓存（保证内容更新即时生效） ----------
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # ---------- Docusaurus 路由处理 ----------
    # Docusaurus 文档每个页面都会生成对应的 .html 文件，无需 SPA 式回退。
    # 顺序：精确文件 → 目录默认页 → 同名 .html → 返回 404（由 error_page 渲染 404 页）
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # ---------- 自定义 404 ----------
    error_page 404 /404.html;
    location = /404.html {
        internal;
        try_files $uri =404;
    }
}
