# Decap CMS 配置 —— EasyDetek 文档管理后台
# 文档：https://decapcms.org/docs/configuration/

# GitHub 后端（通过 OAuth 代理认证）
backend:
  name: github
  repo: easydetek/easydetek.github.io
  branch: main
  base_url: https://docs.easydetek.com
  auth_endpoint: /auth
  app_id: Ov23liggofFVPfvYHeRt

# 切换到 Gitee 后端（国内访问更快）：
# auth_endpoint 不能带 query，代理用 /auth-gitee 区分上游
# backend:
#   name: github           # Decap 用 github driver，但 repo 指向 Gitee
#   repo: easydetek/easydetek.gitee.io
#   branch: main
#   base_url: https://docs.easydetek.com
#   auth_endpoint: /auth-gitee

logo_url: /img/logo-navbar.png

# 媒体资源（产品图片上传目录）
media_folder: "static/img/products"
public_folder: "/img/products"

local_backend: false

site_url: https://docs.easydetek.com

# ===== 内容集合（各产品线）=====
# 使用 nested 嵌套集合：支持在子目录（频段/协议分组）中创建文档
# 编辑器里「Add folder」可新建分组目录

collections:
  # ---------- 模组产品线（按频段分组） ----------
  - name: "modules"
    label: "模组产品线"
    label_singular: "模组产品"
    folder: "modules_docs"
    create: true
    delete: true
    summary: "{{title}} - {{band}}"
    editor:
      preview: true
    nested:
      depth: 2        # 支持一层子目录（5.8GHz/ 24GHz/ 等）
    meta:
      path:
        label: "分组（选已有或输入新名称）"
        widget: string
        index_file: "_index"
    fields:
      - { label: "产品型号", name: "title", widget: "string", hint: "如 EDC116" }
      - { label: "侧边栏排序", name: "sidebar_position", widget: "number", default: 1, required: false }
      - { label: "产品特点", name: "feature", widget: "string", hint: "一句话描述核心特点" }
      - label: "工作频段"
        name: "band"
        widget: "select"
        default: "5.8GHz"
        options: ["5.8GHz", "10.5GHz", "24GHz", "60GHz"]
      - { label: "感应距离", name: "range", widget: "string", required: false }
      - { label: "输出方式", name: "output", widget: "string", required: false, hint: "如 IO/UART/PWM" }
      - { label: "输入电压", name: "vin", widget: "string", required: false }
      - { label: "输出电压", name: "vout", widget: "string", required: false }
      - { label: "外形尺寸", name: "size", widget: "string", required: false }
      - { label: "细分市场", name: "market", widget: "text", required: false }
      - { label: "安装方式", name: "mount", widget: "string", required: false }
      - { label: "应用场景", name: "scene", widget: "text", required: false }
      - { label: "正文内容", name: "body", widget: "markdown", required: false, hint: "额外的详细说明（可选）" }
    # 新建时可选择放入的分组（meta.path 由 nested 提供）

  # ---------- 独立传感器产品线（按协议分组） ----------
  - name: "sensors"
    label: "传感器产品线"
    label_singular: "传感器产品"
    folder: "sensors_docs"
    create: true
    delete: true
    summary: "{{title}} - {{protocol}}"
    nested:
      depth: 2
    meta:
      path:
        label: "分组（选已有或输入新名称）"
        widget: string
        index_file: "_index"
    fields:
      - { label: "产品型号", name: "title", widget: "string", hint: "如 EDQ286B" }
      - { label: "侧边栏排序", name: "sidebar_position", widget: "number", default: 1, required: false }
      - { label: "产品特点", name: "feature", widget: "string" }
      - label: "工作频段"
        name: "band"
        widget: "select"
        default: "24GHz"
        options: ["5.8GHz", "24GHz", "60GHz"]
      - label: "通信协议分组"
        name: "protocol"
        widget: "select"
        default: "BLE蓝牙"
        options: ["AC强电", "Tuya-涂鸦", "Mijia-米家", "BLE蓝牙", "DC干接点", "60GHz康养"]
      - { label: "感应方式", name: "sense", widget: "string", required: false, hint: "如 可见光+毫米波" }
      - { label: "感应距离", name: "range", widget: "string", required: false }
      - { label: "输入电压", name: "vin", widget: "string", required: false }
      - { label: "输出方式", name: "output", widget: "string", required: false }
      - { label: "调参方式", name: "tune", widget: "string", required: false }
      - { label: "安装方式", name: "mount", widget: "string", required: false }
      - label: "产品状态"
        name: "status"
        widget: "select"
        default: "正式量产"
        options: ["正式量产", "研发测试"]
      - { label: "正文内容", name: "body", widget: "markdown", required: false }

  # ---------- 配件产品线 ----------
  - name: "accessories"
    label: "配件产品线"
    label_singular: "配件产品"
    folder: "accessories_docs"
    create: true
    delete: true
    summary: "{{title}} - {{feature}}"
    nested:
      depth: 2
    meta:
      path:
        label: "分组（选已有或输入新名称）"
        widget: string
        index_file: "_index"
    fields:
      - { label: "产品型号", name: "title", widget: "string", hint: "如 EDC59A" }
      - { label: "侧边栏排序", name: "sidebar_position", widget: "number", default: 1, required: false }
      - { label: "产品特点", name: "feature", widget: "string" }
      - { label: "感应距离", name: "range", widget: "string", required: false }
      - { label: "输入电压", name: "vin", widget: "string", required: false }
      - { label: "输出方式", name: "output", widget: "string", required: false }
      - { label: "安装方式", name: "mount", widget: "string", required: false }
      - { label: "细分市场", name: "market", widget: "text", required: false }
      - { label: "正文内容", name: "body", widget: "markdown", required: false }

  # ---------- 开发者资源 ----------
  - name: "opensource"
    label: "开发者资源"
    label_singular: "开发者文档"
    folder: "opensource_docs"
    create: true
    delete: true
    nested:
      depth: 2
    meta:
      path:
        label: "分组（选已有或输入新名称）"
        widget: string
        index_file: "_index"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "侧边栏排序", name: "sidebar_position", widget: "number", default: 1, required: false }
      - { label: "正文内容", name: "body", widget: "markdown" }

  # ---------- 通用文档（快速开始 + FAQ） ----------
  - name: "docs"
    label: "通用文档"
    label_singular: "通用文档"
    folder: "docs"
    create: true
    delete: true
    nested:
      depth: 3        # docs/faq/通用问题/ 有两层
    meta:
      path:
        label: "分组（选已有或输入新名称）"
        widget: string
        index_file: "_index"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "侧边栏排序", name: "sidebar_position", widget: "number", default: 1, required: false }
      - { label: "正文内容", name: "body", widget: "markdown" }

  # ---------- 应用案例 ----------
  - name: "blog"
    label: "应用案例"
    label_singular: "案例"
    folder: "blog"
    create: true
    delete: true
    summary: "{{title}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "URL 标识", name: "slug", widget: "string", required: false, hint: "如 edc116-ceiling-light" }
      - label: "标签"
        name: "tags"
        widget: "list"
        default: ["lighting"]
        required: false
      - { label: "正文内容", name: "body", widget: "markdown" }
