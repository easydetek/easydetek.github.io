<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>EasyDetek 文档管理后台</title>
  <link rel="icon" href="/img/favicon.png" />
  <style>
    /*
     * Decap CMS 3.6.0 登录页 Logo 渲染逻辑（源码分析结论）
     * ------------------------------------------------------------------
     * 登录页主渲染函数 mP（对应 StyledAuthenticationPage <section>）：
     *   const u = logoUrl || logo?.src;
     *   <section>
     *     hP(u)                                              // 顶部 logo 区
     *     ...(错误文案 / 登录按钮 / 站点链接)
     *     {u ? <NetlifyCreditIcon size="100px" type="decap-cms"/> : null}  // ★底部信用图标
     *   </section>
     *
     * hP(u) 分支：
     *   - u 存在 → <CustomIconWrapper width:300px><img src=u alt="Logo"></wrapper>  ← EasyDetek logo（保留）
     *   - u 不存在 → <DecapLogoIcon size="300px" type="decap-cms">                  ← 顶部默认箭头（去掉）
     *
     * ★关键：设置了 logo_url 时，顶部已是 EasyDetek 的 <img>，但底部还会渲染一个
     *        100px、灰色、position:absolute;bottom:10px 的 decap-cms 箭头信用图标
     *        （NetlifyCreditIcon）——这就是页面上“残留的默认箭头 logo”。
     *
     * 定位依据：默认箭头 SVG 的 <path> 带 fill="#FF0082"（Decap 品牌粉，全源码仅
     *   出现一次）。GitHub/登录按钮等功能图标用的是 azure/link 类型，path 不含
     *   #FF0082，故不会被误伤；EasyDetek logo 是 <img>，同样不受影响。
     *
     * 注意：Decap 用 styled-components，DOM 里只有哈希 class（如 exus10f5），
     *   不存在 nc-githubAuthenticationPage-* 这类语义 class（label 仅用于开发
     *   调试，不进 DOM）。因此旧代码里 [class*="AuthenticationPage"] 实际命中
     *   0 个节点——这也是箭头一直残留的根因。这里改用 :has() + path fill 精确匹配。
     */

    /* EasyDetek logo <img> 尺寸与居中（alt="Logo" 是 Decap 写死的，稳定可匹配） */
    img[alt="Logo"] {
      max-height: 46px !important;
      height: 46px !important;
      width: auto !important;
      object-fit: contain !important;
      display: block !important;
      margin: 0 auto !important;
    }

    /*
     * 隐藏 Decap 默认箭头 logo：
     *   - 顶部 300px 的 DecapLogoIcon（未读到 config 时出现）
     *   - 底部 100px 的 NetlifyCreditIcon（设置了 logo_url 时出现 —— 当前场景）
     * 两者都包含 fill="#FF0082" 的 <path>。:has() 在现代浏览器
     * （Chrome105+/Safari15.4+/Firefox121+）生效，加载即隐藏，无闪烁。
     * [fill="..." i] 的 i 标志做大小写不敏感匹配。
     */
    span:has(> svg path[fill="#ff0082" i]) {
      display: none !important;
    }

    /* 登录页字体 */
    .nc-githubAuthenticationPage-text,
    .nc-githubAuthenticationPage-button,
    .nc-githubAuthenticationPage-link {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC',
        'Microsoft YaHei', 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.6.0/dist/decap-cms.js"></script>
  <script>
    // 注册中文界面
    if (window.CMS) {
      window.CMS.registerLocale('zh', {});
    }
    document.title = 'EasyDetek 文档管理后台';

    /*
     * JS 兜底：隐藏 Decap 默认箭头 logo。
     * CSS :has() 已在主流浏览器即时生效；此处用 MutationObserver + path fill
     * 精确识别，覆盖 :has() 不可用的旧浏览器，并确保 SPA 动态挂载的节点也被处理。
     *
     * 识别：svg 内含 fill="#FF0082" 的 path 即判定为 Decap 默认箭头
     *   → 隐藏该 svg 及其外层 Icon <span>。
     * 绝不触碰：EasyDetek 的 <img alt="Logo">（非 svg）、登录按钮功能图标
     *   （azure/link 类型，path 无 #FF0082）。
     */
    (function () {
      var DECAP_FILL = /^#ff0082$/i;

      function isDecapArrow(svg) {
        var paths = svg.querySelectorAll('path');
        for (var i = 0; i < paths.length; i++) {
          var f = paths[i].getAttribute('fill');
          if (f && DECAP_FILL.test(f)) return true;
        }
        return false;
      }

      function hideDecapArrows() {
        var svgs = document.querySelectorAll('svg');
        for (var i = 0; i < svgs.length; i++) {
          var svg = svgs[i];
          if (!isDecapArrow(svg)) continue;
          svg.style.display = 'none';
          var parent = svg.parentElement;
          if (parent && parent.tagName === 'SPAN') {
            parent.style.display = 'none';
          }
        }
      }

      hideDecapArrows();
      var observer = new MutationObserver(function (muts) {
        for (var i = 0; i < muts.length; i++) {
          if (muts[i].addedNodes && muts[i].addedNodes.length) {
            hideDecapArrows();
            return;
          }
        }
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
      setInterval(hideDecapArrows, 1500); // 冷启动轮询保底
    })();
  </script>
</body>
</html>
