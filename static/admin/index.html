<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>EasyDetek 文档管理后台</title>
  <link rel="icon" href="/img/favicon.png" />
  <style>
    /* 替换 Decap CMS 默认 logo 为 EasyDetek logo */
    .nc-githubAuthenticationPage-logo,
    img[src*="decap"],
    img[src*="netlifycms"],
    img[src*="logo"] {
      content: url('/img/logo-navbar.png') !important;
      max-height: 50px !important;
      width: auto !important;
    }
    /* 登录页标题 */
    .nc-githubAuthenticationPage-text {
      font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.6.0/dist/decap-cms.js"></script>
  <script>
    // 注册中文界面
    if (window.CMS) {
      window.CMS.registerLocale('zh', {});
    }
    // 替换页面标题
    document.title = 'EasyDetek 文档管理后台';
  </script>
</body>
</html>
