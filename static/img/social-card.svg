<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="EasyDetek">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2a4f"/>
      <stop offset="0.5" stop-color="#0d3d6e"/>
      <stop offset="1" stop-color="#1473e6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 装饰波纹 -->
  <g transform="translate(960,180)" opacity="0.5">
    <circle r="40" fill="none" stroke="#00b8d4" stroke-width="3"/>
    <circle r="80" fill="none" stroke="#00b8d4" stroke-width="2.5" opacity="0.7"/>
    <circle r="120" fill="none" stroke="#00b8d4" stroke-width="2" opacity="0.5"/>
    <circle r="160" fill="none" stroke="#00b8d4" stroke-width="1.5" opacity="0.3"/>
  </g>
  <!-- Logo -->
  <g transform="translate(100,180)">
    <circle cx="24" cy="24" r="8" fill="#4f9ef5"/>
    <circle cx="24" cy="24" r="18" fill="none" stroke="#4f9ef5" stroke-width="3" opacity="0.8"/>
    <circle cx="24" cy="24" r="30" fill="none" stroke="#00b8d4" stroke-width="2.5" opacity="0.5"/>
    <text x="70" y="42" font-family="'Segoe UI',sans-serif" font-size="56" font-weight="700" fill="#ffffff">
      Easy<tspan fill="#9bcdfa">Detek</tspan>
    </text>
  </g>
  <!-- 标语 -->
  <text x="100" y="360" font-family="'Segoe UI',sans-serif" font-size="44" font-weight="600" fill="#ffffff">
    专业微波 / 毫米波雷达传感方案
  </text>
  <text x="100" y="430" font-family="'Segoe UI',sans-serif" font-size="30" fill="#9bcdfa">
    产品手册 · 开发对接 · 应用案例 · 开源项目
  </text>
</svg>
