<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family='"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif'>
<title>EDV163-N-03 与 EDK60 的接线</title>
<desc>模组 5 根线经 H3 排针接到 EDK60：上行 T→IO4、下行 A→IO5、电源 V/P→3.3V_RADAR、G→GND、RES 空置；禁止插 H4，禁止带电插拔</desc>
<rect width="1200" height="680" fill="#ffffff"/>
<text x="48" y="46" font-size="24" fill="#0f172a" text-anchor="start" font-weight="700">接线：模组 5 根线 → H3 排针 → EDK60</text>
<text x="48" y="72" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">H3 与 H4 信号集合相同但顺序相反（H3 = RES A R T G V P ／ H4 = RES P V G R T A）；串口 256000 8N1 无流控</text>
<text x="96" y="112" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="700">模组侧（EDV163-N-03）</text>
<text x="470" y="112" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="700">H3 排针（丝印，文档只标注 7 脚）</text>
<text x="820" y="112" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="700">EDK60 侧网络</text>
<rect x="90" y="150" width="156" height="54" rx="8" fill="#ffffff" stroke="#0b6bcb" stroke-width="1.6"/>
<text x="168" y="173" font-size="15" fill="#0b6bcb" text-anchor="middle" font-weight="700" font-family='Consolas,"Cascadia Mono","Courier New",monospace'>T</text>
<text x="168" y="192" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">模组 TX</text>
<rect x="462" y="150" width="160" height="54" rx="8" fill="#ffffff" stroke="#0b6bcb" stroke-width="1.6"/>
<text x="542" y="173" font-size="14" fill="#0b6bcb" text-anchor="middle" font-weight="700" font-family='Consolas,"Cascadia Mono","Courier New",monospace'>T</text>
<text x="542" y="192" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="400">第 4 脚</text>
<text x="820" y="174" font-size="15" fill="#0b6bcb" text-anchor="start" font-weight="700" font-family='Consolas,"Cascadia Mono","Courier New",monospace'>IO4</text>
<text x="820" y="192" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">模组 TX → MCU RX ｜ 上行：状态、坐标全靠这条</text>
<line x1="246" y1="177" x2="462" y2="177" stroke="#0b6bcb" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="622" y1="177" x2="812" y2="177" stroke="#0b6bcb" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90" y="216" width="156" height="54" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.6"/>
<text x="168" y="239" font-size="15" fill="#15803d" text-anchor="middle" font-weight="700" font-family='Consolas,"Cascadia Mono","Courier New",monospace'>A</text>
<text x="168" y="258" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">模组 RX</text>
<rect x="462" y="216" width="160" height="54" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.6"/>
<text x="542" y="239" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700" font-family='Consolas,"Cascadia Mono","Courier New",monospace'>A</text>
<text x="542" y="258" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="400">第 2 脚</text>
<text x="820" y="240" font-size="15" fill="#15803d" text-anchor="start" font-weight="700" font-family='Consolas,"Cascadia Mono","Courier New",monospace'>IO5</text>
<text x="820" y="258" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">MCU TX → 模组 RX ｜ 下行：发 GET / SET</text>
<line x1="246" y1="243" x2="462" y2="243" stroke="#15803d" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="622" y1="243" x2="812" y2="243" stroke="#15803d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90" y="282" width="156" height="54" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.6"/>
<text x="168" y="305" font-size="15" fill="#c2410c" text-anchor="middle" font-weight="700" font-family='Consolas,"Cascadia Mono","Courier New",monospace'>V+P</text>
<text x="168" y="324" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">3.3 V（两脚并联）</text>
<rect x="462" y="282" width="160" height="54" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.6"/>
<text x="542" y="305" font-size="14" fill="#c2410c" text-anchor="middle" font-weight="700" font-family='Consolas,"Cascadia Mono","Courier New",monospace'>V / P</text>
<text x="820" y="306" font-size="15" fill="#c2410c" text-anchor="start" font-weight="700" font-family='Consolas,"Cascadia Mono","Courier New",monospace'>3.3V_RADAR</text>
<text x="820" y="324" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">3.3 V 单电源，不需要电平转换</text>
<line x1="246" y1="309" x2="462" y2="309" stroke="#c2410c" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="622" y1="309" x2="812" y2="309" stroke="#c2410c" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90" y="348" width="156" height="54" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
<text x="168" y="371" font-size="15" fill="#64748b" text-anchor="middle" font-weight="700" font-family='Consolas,"Cascadia Mono","Courier New",monospace'>G</text>
<text x="168" y="390" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">GND</text>
<rect x="462" y="348" width="160" height="54" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
<text x="542" y="371" font-size="14" fill="#64748b" text-anchor="middle" font-weight="700" font-family='Consolas,"Cascadia Mono","Courier New",monospace'>G</text>
<text x="820" y="372" font-size="15" fill="#64748b" text-anchor="start" font-weight="700" font-family='Consolas,"Cascadia Mono","Courier New",monospace'>GND</text>
<text x="820" y="390" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">共地（唯一地）</text>
<line x1="246" y1="375" x2="462" y2="375" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="622" y1="375" x2="812" y2="375" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90" y="414" width="156" height="54" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="168" y="437" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="700" font-family='Consolas,"Cascadia Mono","Courier New",monospace'>RES</text>
<text x="168" y="456" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">复位（本方案不用）</text>
<rect x="462" y="414" width="160" height="54" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="542" y="437" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="700" font-family='Consolas,"Cascadia Mono","Courier New",monospace'>RES</text>
<text x="820" y="438" font-size="15" fill="#94a3b8" text-anchor="start" font-weight="700" font-family='Consolas,"Cascadia Mono","Courier New",monospace'>—</text>
<text x="820" y="456" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">空置；T-01 的 A/R 定论前不要插满脚</text>
<line x1="246" y1="441" x2="462" y2="441" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<line x1="622" y1="441" x2="812" y2="441" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<rect x="90" y="492" width="520" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="106" y="516" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">雷达电源使能 = IO14（板载，不从模组取）</text>
<text x="106" y="537" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">高有效、上电常高；丝印 RADAR 的红灯亮 = 模组已上电</text>
<rect x="626" y="492" width="484" height="66" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
<text x="642" y="516" font-size="13" fill="#c2410c" text-anchor="start" font-weight="700">✗ 不要插 H4　✗ 不要带电插拔</text>
<text x="642" y="537" font-size="11.5" fill="#9a3412" text-anchor="start" font-weight="400">H4 顺序相反：插错会电源与数据互相干扰，症状是「红灯亮着却一字节都没有」</text>
<text x="48" y="600" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">为什么这 5 根就够：模组只出串口 + 电源；雷达电源使能由板子控制，可通过 IO14 做一次硬复位。</text>
<text x="48" y="624" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">别照抄人数统计 / 水位那两套的引脚顺序——同板不同固件，但 H3 的 T/A 位置一致，最容易错的是「插 H4」。</text>
<text x="48" y="656" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="400">协议侧：帧长 = 11 + N、无帧尾、不做字节转义（V1.4）。</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
</svg>