<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family='"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif'>
<title>吊装与侧装的几何差异</title>
<desc>吊装：天线朝下，z 有意义，需设挂高 0x25；侧装：天线朝水平，x/y 为主，z 别当身高用；两图都标出检测范围 0x27 与屏蔽区 0x29</desc>
<rect width="1200" height="660" fill="#ffffff"/>
<text x="48" y="46" font-size="24" fill="#0f172a" text-anchor="start" font-weight="700">装在哪：吊装看 z，侧装看 x/y</text>
<text x="48" y="72" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">同一颗模组、两种姿态；检测范围 0x27 默认 ±3000 mm，屏蔽区 0x29 约束 0 &lt; Z &lt; 挂高</text>
<rect x="56" y="100" width="520" height="470" rx="12" fill="#fbfdff" stroke="#cbd5e1" stroke-width="1"/>
<text x="80" y="130" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">吊装（天线朝正下方，2.4~3 m 常见）</text>
<line x1="80" y1="168" x2="552" y2="168" stroke="#cbd5e1" stroke-width="3"/>
<text x="88" y="160" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="400">天花 / 支架</text>
<line x1="80" y1="500" x2="552" y2="500" stroke="#cbd5e1" stroke-width="3"/>
<text x="88" y="516" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="400">地面 = z 的 0 参考（待实测确认）</text>
<rect x="292" y="170" width="76" height="20" rx="4" fill="#ffffff" stroke="#0b6bcb" stroke-width="1.6"/>
<text x="330" y="184" font-size="10" fill="#0b6bcb" text-anchor="middle" font-weight="400" font-family='Consolas,"Cascadia Mono","Courier New",monospace'>radar</text>
<path d="M 300 192 L 196 500 L 470 500 Z" fill="#0b6bcb" opacity="0.06" stroke="#0b6bcb" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="330" y1="194" x2="330" y2="496" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="338" y="300" font-size="13" fill="#64748b" text-anchor="start" font-weight="700">z</text>
<line x1="150" y1="190" x2="150" y2="500" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 3"/>
<line x1="144" y1="190" x2="330" y2="190" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="2 3"/>
<text x="160" y="322" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="700">挂高 0x25</text>
<text x="160" y="338" font-size="11.5" fill="#7c3aed" text-anchor="start" font-weight="400">1200~5000 mm</text>
<text x="160" y="354" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">必须显式下发</text>
<line x1="500" y1="320" x2="500" y2="430" stroke="#c2410c" stroke-width="1.6"/>
<line x1="494" y1="320" x2="506" y2="320" stroke="#c2410c" stroke-width="1.6"/>
<line x1="494" y1="430" x2="506" y2="430" stroke="#c2410c" stroke-width="1.6"/>
<text x="514" y="370" font-size="12" fill="#c2410c" text-anchor="start" font-weight="700">0x26</text>
<text x="514" y="386" font-size="11" fill="#c2410c" text-anchor="start" font-weight="400">检测高度</text>
<circle cx="420" cy="438" r="9" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M 408 450 L 432 450 L 429 500 L 411 500 Z" fill="none" stroke="#64748b" stroke-width="2"/>
<text x="438" y="470" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">z ≈ 826 mm</text>
<text x="438" y="485" font-size="10.5" fill="#94a3b8" text-anchor="start" font-weight="400">（实测例）</text>
<rect x="96" y="446" width="62" height="54" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3" opacity="0.65"/>
<text x="102" y="492" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" font-family='Consolas,"Cascadia Mono","Courier New",monospace'>0x29</text>
<text x="102" y="478" font-size="10" fill="#64748b" text-anchor="start" font-weight="400">屏蔽区</text>
<text x="356" y="236" font-size="11.5" fill="#0b6bcb" text-anchor="start" font-weight="700">0x27 检测范围 ±3000 mm</text>
<rect x="624" y="100" width="520" height="470" rx="12" fill="#fbfdff" stroke="#cbd5e1" stroke-width="1"/>
<text x="648" y="130" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">侧装（天线朝水平，产品页 0.5~1.8 m）</text>
<line x1="668" y1="168" x2="668" y2="500" stroke="#cbd5e1" stroke-width="3"/>
<text x="674" y="160" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="400">墙 / 立柱</text>
<line x1="648" y1="500" x2="1120" y2="500" stroke="#cbd5e1" stroke-width="3"/>
<text x="652" y="516" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="400">地面</text>
<rect x="670" y="246" width="20" height="76" rx="4" fill="#ffffff" stroke="#0b6bcb" stroke-width="1.6"/>
<text x="702" y="240" font-size="10" fill="#0b6bcb" text-anchor="start" font-weight="400" font-family='Consolas,"Cascadia Mono","Courier New",monospace'>radar</text>
<line x1="706" y1="244" x2="690" y2="252" stroke="#64748b" stroke-width="1" stroke-dasharray="2 2"/>
<path d="M 690 252 L 1096 152 L 1096 416 Z" fill="#0b6bcb" opacity="0.06" stroke="#0b6bcb" stroke-width="1" stroke-dasharray="5 4"/>
<text x="698" y="210" font-size="12" fill="#0b6bcb" text-anchor="start" font-weight="700">正面扇区：x/y 是主角</text>
<circle cx="900" cy="438" r="9" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M 888 450 L 912 450 L 909 500 L 891 500 Z" fill="none" stroke="#64748b" stroke-width="2"/>
<line x1="900" y1="470" x2="900" y2="430" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="1100" y1="246" x2="1100" y2="500" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="1088" y="380" font-size="11.5" fill="#7c3aed" text-anchor="end" font-weight="400">0.5~1.8 m</text>
<text x="648" y="420" font-size="12" fill="#c2410c" text-anchor="start" font-weight="700">z 在这套姿态里不代表身高</text>
<text x="648" y="438" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">（0&lt;Z&lt;挂高 仍成立，但原点未知）</text>
<rect x="56" y="590" width="1088" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="74" y="614" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">同一套坐标，两种含义</text>
<text x="74" y="636" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">吊装：z 有意义（但 0 在雷达面还是地面仍待实测）；侧装：x/y 是水平位移，z 不要当身高。两种姿态都是「检测范围 0x27 收窄 + 屏蔽区 0x29 挡掉家具」来解决误判。</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
</svg>