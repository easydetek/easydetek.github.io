# ============================================================
# EasyDetek 站点 —— docker compose（生产部署）
# 架构：现有 Nginx(宿主机) → 站点容器(nginx:80) + OAuth 代理
# HTTPS 由宿主机现有 Nginx 处理
# ============================================================
# 常用命令：
#   启动：  docker compose up -d --build
#   停止：  docker compose down
#   日志：  docker compose logs -f
# ============================================================

services:
  # ---- 站点本体：nginx 托管静态站 ----
  easydetek-site:
    build:
      context: .
      args:
        SITE_URL: https://docs.easydetek.com
    image: easydetek-site:latest
    container_name: easydetek-site
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"   # 只监听本地 8080，由宿主机 Nginx 反代
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- OAuth 代理：为 CMS 后台提供登录认证 ----
  oauth-proxy:
    build: ./oauth-proxy
    container_name: easydetek-oauth-proxy
    restart: unless-stopped
    env_file: .env
    environment:
      - ORIGIN=https://docs.easydetek.com
      - PORT=8081
    ports:
      - "127.0.0.1:8081:8081"  # 只监听本地 8081，由宿主机 Nginx 反代
